name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU backend + pymapf parity deps)
        run: pip install -e '.[dev]'
      - name: Run the CPU test suite
        run: pytest -v

  # NVRTC is a pure compiler: with CuPy's pip-shipped CUDA libraries
  # the bundled kernels compile with no GPU device and no driver (the
  # test calls libnvrtc directly with an explicit arch), so a kernel
  # that no longer parses fails CI even though CI has no GPU.
  kernel-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with CuPy and CUDA headers (no GPU present)
        run: |
          pip install -e .
          pip install pytest 'cupy-cuda12x[ctk]'
      - name: NVRTC-compile all bundled kernels
        run: pytest tests/test_kernels.py -v

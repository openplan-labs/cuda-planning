name: Feature request
description: A new algorithm, backend capability, or API improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What you are trying to do that the library does not support.
        For a new algorithm, cite the paper and say what the GPU
        parallelization would be — batching across agents/queries is
        the pattern this library exists for.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: >
        Rough API sketch if you have one. Check the roadmap first:
        CBS, LaCAM, LNS, SIPP and NMPC are already planned.
    validations:
      required: false

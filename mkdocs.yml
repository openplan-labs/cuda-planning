site_name: cuda-planning
site_description: >-
  CUDA-accelerated multi-agent path finding and planning, with a NumPy
  reference backend.
site_url: https://openplan-labs.github.io/cuda-planning/
repo_url: https://github.com/openplan-labs/cuda-planning
repo_name: openplan-labs/cuda-planning
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mark-accent.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Libre Franklin
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/frontier.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            members_order: source
            separate_signature: true

nav:
  - Home: index.md
  - Install: install.md
  - Algorithms:
      - Batched BFS: algorithms/bfs.md
      - Batched and space-time A*: algorithms/astar.md
      - Prioritized planning: algorithms/prioritized.md
      - PIBT: algorithms/pibt.md
      - Velocity obstacles: algorithms/velocity-obstacles.md
      - Flocking: algorithms/flocking.md
  - Benchmarks: benchmarks.md
  - API reference: api.md
  - Roadmap: roadmap.md
